# ── Allow only "websocket" upgrades (mitigates H2C smuggling) ───────────────
map $http_upgrade $ws_upgrade {
    ~*^websocket$   websocket;
    default         "";
}

map $http_upgrade $ws_connection {
    ~*^websocket$   "upgrade";
    default         "";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── Max upload size (mobile photos can be >10 MB) ───────────────────────
    client_max_body_size 50m;

    # ── Reverse-proxy API calls to the backend ──────────────────────────────
    location /api/ {
        proxy_pass http://tenebra-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              tenebra-server;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Reverse-proxy Socket.io to the backend ──────────────────────────────
    # H2C smuggling mitigated: $ws_upgrade/$ws_connection are set via map blocks
    # above, which only allow the literal value "websocket" (case-insensitive) —
    # all other upgrade attempts (e.g. h2c) are mapped to empty strings.
    location /socket.io/ {
        proxy_pass http://tenebra-server:3000;
        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $ws_upgrade;
        proxy_set_header Connection        $ws_connection;
        proxy_set_header Host              tenebra-server;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static assets — cache aggressively ──────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback — serve index.html for all non-file routes ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
